<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tube My Filter</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <h1>Tube My Filter</h1>

  <section>
    <h2>モード</h2>
    <div class="modes" role="radiogroup">
      <label><input type="radio" name="mode" value="off"> 停止</label>
      <label><input type="radio" name="mode" value="observe"> 判定のみ</label>
      <label><input type="radio" name="mode" value="hide"> 非表示</label>
    </div>
    <p class="note">対象: 検索結果・ホーム・再生ページの関連動画の通常動画カード（Shorts・ミックス・広告は対象外）。判定のみ: 一致は赤枠、未判定は灰色の点線枠（隠さない）。</p>
  </section>

  <section id="stats-section" hidden>
    <h2>このタブの判定</h2>
    <dl id="stats"></dl>
  </section>

  <section>
    <h2>チャンネルを登録</h2>
    <form id="add-form">
      <input id="add-input" type="text" autocomplete="off" spellcheck="false"
             placeholder="@ハンドル / UC…のID / チャンネルURL" required>
      <input id="add-label" type="text" autocomplete="off" placeholder="メモ（任意）">
      <button type="submit">登録</button>
    </form>
    <p id="add-message" class="message" aria-live="polite"></p>
    <p class="note">ハンドルとIDは別のルールです。検索結果のカードは主にハンドルで表示されるため、ハンドルでの登録を推奨します。</p>
  </section>

  <section>
    <h2>登録済み（<span id="rule-count">0</span>）</h2>
    <ul id="rules"></ul>
  </section>

  <script src="../lib/channel.js"></script>
  <script src="../lib/settings.js"></script>
  <script src="options.js"></script>
</body>
</html>
